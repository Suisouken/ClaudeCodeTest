<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かぞくスイカゲーム</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍👩‍👧‍👦</text></svg>">
<style>
  :root {
    --bg1: #ffe7a0;
    --bg2: #ffd166;
    --frame: #b5651d;
    --frame-dark: #8a4a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(160deg, #fff3c4, #ffd166);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #5a3a12;
    overflow: hidden;
    touch-action: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
  }
  #hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel {
    background: rgba(255,255,255,0.65);
    border: 2px solid var(--frame);
    border-radius: 14px;
    padding: 6px 12px;
    box-shadow: 0 3px 0 rgba(138,74,18,0.35);
  }
  .label { font-size: 11px; opacity: 0.75; letter-spacing: 1px; }
  .value { font-size: 22px; font-weight: 800; line-height: 1; }
  #stage-wrap {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(138,74,18,0.35), inset 0 0 0 6px var(--frame);
    background: linear-gradient(180deg, #fff7e0, #ffe9b0);
  }
  canvas { display: block; }
  #next {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #next-face {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    font-size: 26px;
    border-radius: 50%;
    overflow: hidden;
    background: rgba(255,255,255,0.5);
  }
  #next-face img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  #photo-btn {
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    background: #2a9d8f;
    border: none;
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1d7268;
  }
  #photo-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d7268; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(90,58,18,0.78);
    color: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 30px; }
  .overlay p { font-size: 15px; opacity: 0.9; }
  button.btn {
    margin-top: 6px;
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    background: #e76f51;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b5482f;
    transition: transform .05s, box-shadow .05s;
  }
  button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b5482f; }
  #hint { font-size: 12px; opacity: 0.7; height: 16px; }
  #evolve {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    opacity: 0.9;
  }
  #evolve .chip {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 50%;
    overflow: hidden;
    line-height: 1;
  }
  #evolve .chip img { width: 100%; height: 100%; object-fit: cover; }

  /* --- 写真設定画面 --- */
  #setup {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #fff3c4, #ffd166);
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
    gap: 10px;
    overflow-y: auto;
    touch-action: pan-y;
    z-index: 10;
  }
  #setup.show { display: flex; }
  #setup h1 { font-size: 22px; }
  #setup .desc { font-size: 13px; opacity: 0.8; text-align: center; max-width: 420px; }
  #slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, 96px);
    gap: 10px;
    justify-content: center;
    width: 100%;
    max-width: 440px;
  }
  .slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.65);
    border: 2px solid var(--frame);
    border-radius: 14px;
    padding: 8px 4px;
  }
  .slot .num { font-size: 10px; opacity: 0.7; }
  .slot .face {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    display: grid; place-items: center;
    font-size: 34px;
    background: #fff;
    border: 2px dashed rgba(138,74,18,0.4);
    cursor: pointer;
  }
  .slot .face.has-photo { border-style: solid; }
  .slot .face img { width: 100%; height: 100%; object-fit: cover; }
  .slot input[type="text"] {
    width: 84px;
    font: inherit;
    font-size: 11px;
    text-align: center;
    border: 1px solid rgba(138,74,18,0.4);
    border-radius: 8px;
    padding: 3px 4px;
    background: rgba(255,255,255,0.8);
    color: inherit;
  }
  .slot .clear {
    font-size: 10px;
    color: #b5482f;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  #setup .actions { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="panel" id="next">
      <div>
        <div class="label">NEXT</div>
        <div class="value" style="font-size:13px;" id="next-name">-</div>
      </div>
      <div id="next-face">🍒</div>
    </div>
    <button id="photo-btn">📷 写真</button>
  </div>

  <div id="stage-wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ov-title">ゲームオーバー</h1>
      <p id="ov-msg">スコア: 0</p>
      <button class="btn" id="restart">もう一度あそぶ</button>
    </div>
  </div>

  <div id="hint">タップ / クリックで落とす</div>
  <div id="evolve"></div>
</div>

<!-- 写真設定画面 -->
<div id="setup">
  <h1>👨‍👩‍👧‍👦 家族の写真を設定</h1>
  <p class="desc">小さい順（No.1）から大きい順（No.11）へ進化します。丸をタップして写真を選んでね。名前も変えられます。写真はこの端末のブラウザにだけ保存されます。</p>
  <div id="slots"></div>
  <div class="actions">
    <button class="btn" id="setup-done">あそぶ！</button>
  </div>
</div>

<script src="matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
