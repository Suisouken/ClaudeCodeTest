<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>爆発チェーンスイカ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% -10%, #3a1c10, #160a06);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #ffe0c0;
    overflow: hidden;
    touch-action: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
  }
  #hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .panel {
    background: rgba(255,160,80,0.12);
    border: 1px solid rgba(255,150,70,0.45);
    border-radius: 12px;
    padding: 5px 14px;
    text-align: center;
  }
  .label { font-size: 10px; letter-spacing: 1px; opacity: 0.7; }
  .value { font-size: 22px; font-weight: 800; line-height: 1.1; color: #ffb86b; }
  #next { display: flex; align-items: center; gap: 8px; }
  #next-fruit { font-size: 26px; }
  #stage-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,0.6), inset 0 0 0 5px #7a3b18;
    background: linear-gradient(180deg, #2a160c, #1c0f08);
  }
  canvas { display: block; touch-action: none; }
  #combo {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translateX(-50%) scale(1);
    font-weight: 900;
    font-size: 40px;
    color: #ffd166;
    text-shadow: 0 0 14px rgba(255,120,40,0.9), 0 2px 0 #b5482f;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(22,10,6,0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 22px;
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; color: #ffb86b; }
  #overlay p { font-size: 15px; opacity: 0.9; line-height: 1.7; }
  button.btn {
    margin-top: 6px;
    touch-action: manipulation;
    font: inherit; font-weight: 800; font-size: 18px;
    color: #160a06; background: #ffb86b; border: none;
    border-radius: 12px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 4px 0 #b5642f;
  }
  button.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b5642f; }
  #hint { font-size: 12px; opacity: 0.65; height: 16px; text-align: center; }
  #evolve { width: 100%; max-width: 420px; display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; font-size: 17px; opacity: 0.8; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">BEST</div><div class="value" id="best">0</div></div>
    <div class="panel" id="next">
      <div><div class="label">NEXT</div><div class="value" style="font-size:13px;" id="next-name">-</div></div>
      <div id="next-fruit">🍒</div>
    </div>
  </div>

  <div id="stage-wrap">
    <canvas id="game"></canvas>
    <div id="combo"></div>
    <div id="overlay">
      <h1>💥 爆発チェーンスイカ</h1>
      <p>同じフルーツがぶつかると合体し、<br><b>衝撃波</b>で周りを吹き飛ばす！<br>連鎖でコンボを決めて高得点を狙え。</p>
      <button class="btn" id="start">スタート</button>
    </div>
  </div>

  <div id="hint">タップ / ドラッグで位置決め、離して落とす</div>
  <div id="evolve">
    <span>🍒</span>→<span>🍓</span>→<span>🍇</span>→<span>🍊</span>→<span>🍎</span>→<span>🍐</span>→<span>🍑</span>→<span>🍍</span>→<span>🥥</span>→<span>🍈</span>→<span>🍉</span>
  </div>
</div>

<script src="matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
